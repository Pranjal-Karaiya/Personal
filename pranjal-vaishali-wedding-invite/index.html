<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranjal &amp; Vaishali | Wedding Invitation</title>
    <meta name="description" content="Join Pranjal &amp; Vaishali for their wedding celebration in Bilaspur, Chhattisgarh on 15 February 2027.">
    <meta property="og:title" content="Pranjal &amp; Vaishali | Wedding Invitation">
    <meta property="og:description" content="Join Pranjal &amp; Vaishali for their wedding celebration in Bilaspur, Chhattisgarh on 15 February 2027.">
    <meta property="og:image" content="assets/images/hero/hero-main.svg">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@400;600&family=Great+Vibes&family=Italianno&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <div id="opening-screen" class="opening-screen" role="dialog" aria-modal="true" aria-label="Wedding invitation cover"></div>

    <div id="main-content" hidden>
      <header id="hero"></header>
      <main>
        <section id="invitation" aria-labelledby="invitation-heading"></section>
        <section id="countdown" aria-label="Wedding countdown"></section>
        <section id="date-reveal" aria-label="Save the date"></section>
        <section id="story" aria-label="Our story"></section>
        <section id="events" aria-label="Wedding events schedule"></section>
        <section id="gallery" aria-label="Photo gallery"></section>
        <section id="venue" aria-label="Venue"></section>
        <section id="rsvp" aria-label="RSVP"></section>
      </main>
      <footer id="footer"></footer>
    </div>

    <div class="floating-controls" aria-label="Site controls">
      <button type="button" id="back-to-top" class="floating-btn back-to-top" aria-label="Back to top"></button>
      <button type="button" id="share-control" class="floating-btn" aria-label="Share invitation"></button>
      <button type="button" id="music-control" class="floating-btn" aria-label="Play background music" aria-pressed="false"></button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Image gallery">
      <button type="button" class="lightbox__close" aria-label="Close gallery">&times;</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&#8249;</button>
      <img class="lightbox__img" src="" alt="">
      <button type="button" class="lightbox__nav lightbox__nav--next" aria-label="Next image">&#8250;</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranjal &amp; Vaishali | Wedding Invitation</title>
    <meta name="description" content="Join Pranjal &amp; Vaishali for their wedding celebration in Bilaspur, Chhattisgarh on 15 February 2027.">
    <meta property="og:title" content="Pranjal &amp; Vaishali | Wedding Invitation">
    <meta property="og:description" content="Join Pranjal &amp; Vaishali for their wedding celebration in Bilaspur, Chhattisgarh on 15 February 2027.">
    <meta property="og:image" content="assets/images/hero/hero-main.svg">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@400;600&family=Great+Vibes&family=Italianno&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css?v=20261004-2">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/royal-prestige.css">
    <link rel="stylesheet" href="css/envelope.css">
    <link rel="stylesheet" href="css/cinematic-text.css">
  </head>
  <body class="theme-royal-prestige">
    <div id="envelope-screen" class="envelope-screen" role="dialog" aria-modal="true" aria-label="Wedding invitation envelope"></div>

    <div id="main-content">
      <header id="hero"></header>
      <main>
        <section id="invitation" aria-labelledby="invitation-heading"></section>
        <section id="countdown" aria-label="Wedding countdown"></section>
        <section id="date-reveal" aria-label="Save the date"></section>
        <section id="story" aria-label="Our story"></section>
        <section id="events" aria-label="Wedding events schedule"></section>
        <section id="gallery" aria-label="Photo gallery"></section>
        <section id="venue" aria-label="Venue"></section>
        <section id="rsvp" aria-label="RSVP"></section>
      </main>
      <footer id="footer"></footer>
    </div>

    <div class="floating-controls" aria-label="Site controls">
      <button type="button" id="back-to-top" class="floating-btn back-to-top" aria-label="Back to top"></button>
      <button type="button" id="music-control" class="floating-btn" aria-label="Play background music" aria-pressed="false"></button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Image gallery">
      <button type="button" class="lightbox__close" aria-label="Close gallery">&times;</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&#8249;</button>
      <img class="lightbox__img" src="" alt="">
      <button type="button" class="lightbox__nav lightbox__nav--next" aria-label="Next image">&#8250;</button>
    </div>

    <script>\n      (() => {\n        const screen = document.getElementById("envelope-screen");\n        if (!screen || screen.children.length) return;\n        screen.classList.add("envelope-screen--video");\n        const video = document.createElement("video");\n        video.className = "envelope-screen__video";\n        video.src = "assets/video/royal-prestige.mp4";\n        video.muted = true;\n        video.playsInline = true;\n        video.setAttribute("playsinline", "");\n        video.setAttribute("webkit-playsinline", "");\n        video.preload = "auto";\n        const tap = document.createElement("button");\n        tap.type = "button";\n        tap.className = "envelope-screen__tap";\n        tap.setAttribute("aria-label", "Tap to play invitation video");\n        tap.addEventListener("click", () => {\n          video.play().catch(() => {});\n          tap.classList.add("is-playing");\n        }, { once: true });\n        screen.append(video, tap);\n      })();\n    </script>\n    <script type="module" src="js/main.js?v=20261004-2"></script>
  </body>
</html>
